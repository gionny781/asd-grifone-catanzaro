media:
  input: images/uploads
  output: images/uploads

content:
  - name: manutenzione
    label: ⚠ Modalità manutenzione (sito in pausa)
    type: file
    path: data/manutenzione.json
    format: json
    fields:
      - name: attiva
        label: Sito in pausa (se attivo, i visitatori vedono solo la pagina di avviso)
        type: boolean
      - name: titolo
        label: Titolo dell'avviso
        type: string
      - name: messaggio
        label: Messaggio (lascia una riga vuota tra i paragrafi)
        type: text
      - name: fino_al
        label: Torniamo online il (facoltativo, es. 3 dicembre)
        type: string
      - name: immagine
        label: Immagine personalizzata (facoltativa; se vuota usa la grafica del Grifone)
        type: image

  - name: fotosquadra
    label: Foto della squadra attuale
    type: file
    path: data/fotosquadra.json
    format: json
    fields:
      - name: foto
        label: Foto della squadra
        type: image
      - name: didascalia
        label: Didascalia (es. Stagione 2026 - 2027)
        type: string
      - name: home
        label: Mostra nella Home
        type: boolean
      - name: pagina_squadra
        label: Mostra nella pagina Squadra
        type: boolean

  - name: societa
    label: Società (chi siamo)
    type: file
    path: data/societa.json
    format: json
    fields:
      - name: chi_siamo
        label: Chi siamo (storia e presentazione; lascia una riga vuota tra i paragrafi)
        type: text
      - name: fondazione
        label: Anno di fondazione
        type: string
      - name: campo
        label: Campo di gioco
        type: string
      - name: colori
        label: Colori sociali
        type: string
      - name: email
        label: Email di contatto
        type: string

  - name: contatti
    label: Contatti e mappe
    type: file
    path: data/contatti.json
    format: json
    fields:
      - name: stadio_nome
        label: Nome dello stadio / campo
        type: string
      - name: stadio_indirizzo
        label: Indirizzo dello stadio (per la mappa)
        type: string
      - name: sede_indirizzo
        label: Indirizzo della sede legale (per la mappa)
        type: string
      - name: telefono
        label: Telefono generale (facoltativo)
        type: string
      - name: contatti
        label: Contatti utili
        type: object
        list: true
        fields:
          - name: area
            label: Area (es. Segreteria)
            type: string
          - name: email
            label: Email
            type: string
          - name: telefono
            label: Telefono (facoltativo)
            type: string

  - name: calciatori
    label: Calciatori
    type: file
    path: data/calciatori.json
    format: json
    list: true
    fields:
      - name: nome
        label: Nome e cognome
        type: string
        required: true
      - name: numero
        label: Numero di maglia
        type: string
      - name: ruolo
        label: Ruolo
        type: select
        options:
          values: [Portiere, Difensore, Centrocampista, Attaccante]
      - name: anno_nascita
        label: Anno o data di nascita
        type: string
      - name: foto
        label: Foto (organigramma / elenco)
        type: image
      - name: foto_scheda
        label: Foto per la scheda personale (facoltativa; se vuota usa quella sopra)
        type: image
      - name: bio
        label: Presentazione (facoltativa, appare nella scheda personale)
        type: text

  - name: staff
    label: Staff e dirigenza
    type: file
    path: data/staff.json
    format: json
    list: true
    fields:
      - name: ordine
        label: Posizione (numero più basso = più in alto; usa 10, 20, 30… così puoi inserire 15 in mezzo)
        type: string
      - name: nome
        label: Nome e cognome
        type: string
        required: true
      - name: ruolo
        label: Ruolo (es. Presidente, Vicepresidente, Allenatore). Persone con lo stesso ruolo vengono raggruppate
        type: string
      - name: area
        label: Dove mostrarlo
        type: select
        options:
          values: [Dirigenza, Staff tecnico]
      - name: foto
        label: Foto (organigramma / elenco)
        type: image
      - name: foto_scheda
        label: Foto per la scheda personale (facoltativa; se vuota usa quella sopra)
        type: image
      - name: data_nascita
        label: Data di nascita (facoltativa)
        type: string
      - name: bio
        label: Presentazione (facoltativa, appare nella scheda personale)
        type: text

  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: data
        label: Data
        type: date
        required: true
      - name: categoria
        label: Categoria
        type: select
        options:
          values: [Prima squadra, Società, Settore giovanile, Eventi]
      - name: foto
        label: Foto di copertina
        type: image
      - name: sommario
        label: Sommario (1-2 righe)
        type: text
      - name: testo
        label: Testo completo
        type: text

  - name: gallery
    label: Fotogallery (un carosello per ogni galleria)
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo della galleria (es. Vigor Catanzaro - ASD Grifone 18.02.2023, oppure Allenamenti di novembre)
        type: string
        required: true
      - name: album
        label: Album / stagione (es. Stagione 2022 - 2023). Scrivilo sempre uguale per raggruppare
        type: string
      - name: data
        label: Data
        type: date
      - name: foto_didascalia
        label: Foto con didascalia (una alla volta, ognuna con la sua descrizione)
        type: object
        list: true
        fields:
          - name: immagine
            label: Foto
            type: image
          - name: didascalia
            label: Didascalia di questa foto
            type: string
      - name: foto
        label: Caricamento veloce (tante foto insieme, senza didascalia; vengono dopo quelle sopra)
        type: image
        list: true
      - name: home
        label: Mostra questo carosello nella Home
        type: boolean

  - name: carosello
    label: Carosello della Home (impostazioni)
    type: file
    path: data/carosello.json
    format: json
    fields:
      - name: home
        label: Mostra il carosello nella Home
        type: boolean
      - name: titolo
        label: Titolo sopra il carosello della Home (facoltativo; se vuoto usa il titolo della partita)
        type: string
      - name: secondi
        label: Secondi tra una foto e l'altra (0 = non scorre da solo)
        type: string

  - name: video
    label: Video
    type: file
    path: data/video.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: youtube
        label: Link YouTube
        type: string
        required: true
      - name: album
        label: Album / stagione (es. Stagione 2022 - 2023)
        type: string
      - name: data
        label: Data (facoltativa, per l'ordine)
        type: date

  - name: sponsor
    label: Partner e sponsor
    type: file
    path: data/sponsor.json
    format: json
    list: true
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
      - name: link
        label: Sito web (facoltativo)
        type: string
