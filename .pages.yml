media:
  input: images/uploads
  output: images/uploads

content:
  - name: societa
    label: Società (chi siamo e foto squadra)
    type: file
    path: data/societa.json
    format: json
    fields:
      - name: foto_squadra
        label: Foto della squadra (appare in Home e nella pagina Squadra)
        type: image
      - name: didascalia_foto
        label: Didascalia foto squadra (es. Stagione 2026/27)
        type: string
      - name: chi_siamo
        label: Chi siamo (storia e presentazione; lascia una riga vuota tra i paragrafi)
        type: text
      - name: fondazione
        label: Anno di fondazione
        type: string
      - name: campo
        label: Campo di gioco
        type: string
      - name: email
        label: Email di contatto
        type: string

  - name: contatti
    label: Contatti e mappe
    type: file
    path: data/contatti.json
    format: json
    fields:
      - name: stadio_nome
        label: Nome dello stadio / campo
        type: string
      - name: stadio_indirizzo
        label: Indirizzo dello stadio (per la mappa)
        type: string
      - name: sede_indirizzo
        label: Indirizzo della sede legale (per la mappa)
        type: string
      - name: telefono
        label: Telefono generale (facoltativo)
        type: string
      - name: contatti
        label: Contatti utili
        type: object
        list: true
        fields:
          - name: area
            label: Area (es. Segreteria)
            type: string
          - name: email
            label: Email
            type: string
          - name: telefono
            label: Telefono (facoltativo)
            type: string

  - name: calciatori
    label: Calciatori
    type: file
    path: data/calciatori.json
    format: json
    list: true
    fields:
      - name: nome
        label: Nome e cognome
        type: string
        required: true
      - name: numero
        label: Numero di maglia
        type: string
      - name: ruolo
        label: Ruolo
        type: select
        options:
          values: [Portiere, Difensore, Centrocampista, Attaccante]
      - name: anno_nascita
        label: Anno o data di nascita
        type: string
      - name: foto
        label: Foto (organigramma / elenco)
        type: image
      - name: foto_scheda
        label: Foto per la scheda personale (facoltativa; se vuota usa quella sopra)
        type: image
      - name: bio
        label: Presentazione (facoltativa, appare nella scheda personale)
        type: text

  - name: staff
    label: Staff e dirigenza
    type: file
    path: data/staff.json
    format: json
    list: true
    fields:
      - name: nome
        label: Nome e cognome
        type: string
        required: true
      - name: ruolo
        label: Ruolo (es. Presidente, Vicepresidente, Allenatore). Persone con lo stesso ruolo vengono raggruppate; l'ordine nell'elenco è l'ordine dell'organigramma
        type: string
      - name: area
        label: Dove mostrarlo
        type: select
        options:
          values: [Dirigenza, Staff tecnico]
      - name: foto
        label: Foto (organigramma / elenco)
        type: image
      - name: foto_scheda
        label: Foto per la scheda personale (facoltativa; se vuota usa quella sopra)
        type: image
      - name: data_nascita
        label: Data di nascita (facoltativa)
        type: string
      - name: bio
        label: Presentazione (facoltativa, appare nella scheda personale)
        type: text

  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: data
        label: Data
        type: date
        required: true
      - name: categoria
        label: Categoria
        type: select
        options:
          values: [Prima squadra, Società, Settore giovanile, Eventi]
      - name: foto
        label: Foto di copertina
        type: image
      - name: sommario
        label: Sommario (1-2 righe)
        type: text
      - name: testo
        label: Testo completo
        type: text

  - name: gallery
    label: Fotogallery
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: foto
        label: Foto
        type: image
        required: true
      - name: didascalia
        label: Didascalia
        type: string
      - name: data
        label: Data
        type: date

  - name: video
    label: Video
    type: file
    path: data/video.json
    format: json
    list: true
    fields:
      - name: titolo
        label: Titolo
        type: string
        required: true
      - name: youtube
        label: Link YouTube
        type: string
        required: true

  - name: sponsor
    label: Partner e sponsor
    type: file
    path: data/sponsor.json
    format: json
    list: true
    fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
      - name: link
        label: Sito web (facoltativo)
        type: string
